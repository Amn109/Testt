<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Musée — Archives</title>

  <link rel="stylesheet" href="archives.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- top navigation -->
  

  <!-- 3D canvas -->
  <canvas id="museum-canvas"></canvas>

  <!-- Viewer fullscreen pour lire / feuilleter les archives -->
  <div id="archiveViewer" aria-hidden="true" class="archive-viewer" role="dialog" aria-label="Lecteur d'archives">
    <div class="viewer-shell">
      <header class="viewer-header">
        <button id="archiveClose" class="viewer-close" aria-label="Fermer">✕</button>
        <div class="viewer-controls">
          <button id="archivePrev" class="viewer-btn">« Précédent</button>
          <span id="archiveIdx" class="viewer-index"></span>
          <button id="archiveNext" class="viewer-btn">Suivant »</button>
        </div>
      </header>

      <div class="viewer-pages">
        <section id="archiveLeft" class="viewer-page" aria-label="Page gauche"></section>
        <section id="archiveRight" class="viewer-page" aria-label="Page droite"></section>
      </div>

      <footer class="viewer-footer">
        <div class="viewer-hint">Utilise ← → ou les boutons pour naviguer. Échap pour fermer.</div>
      </footer>
    </div>
  </div>

  <div class="hint">
    <div class="title">Cabinet d'archives</div>
    <div class="sub">Clique sur un livre dans une vitrine pour l'ouvrir →</div>
  </div>
  
  <div class="credits">UNSC <img src="https://cdn.helloasso.com/img/logos/croppedimage-2b0858ea35264299ad7d65fc4830286e.png" alt=""></div>
