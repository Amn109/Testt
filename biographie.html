<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Biographie — Parcours de vie</title>
  <link rel="stylesheet" href="biographie.css">
</head>
<body>
  <nav class="topbar">
    <div class="nav-inner">
      <a class="nav-btn" href="index.html">Accueil</a>
      <a class="nav-btn" href="archives.html">Archives</a>
    </div>
  </nav>

  <canvas id="scene-canvas"></canvas>

  <!-- Overlay biographie -->
  <div id="bioOverlay" class="bio-overlay" aria-hidden="true">
    <div class="bio-card">
      <div class="bio-head">
        <div>
          <h2 id="bioTitle">Titre</h2>
          <div id="bioSubtitle" class="subtitle">Sous-titre</div>
        </div>
        <div class="bio-controls">
          <button id="prevBtn">Précédent</button>
          <button id="nextBtn">Suivant</button>
          <button id="closeBtn" class="close">Fermer</button>
        </div>
      </div>
      <div id="bioText" class="bio-text">Contenu…</div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
