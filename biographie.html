<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Musée — Biographie (Galerie murale)</title>
  <link rel="stylesheet" href="biographie.css">
</head>
<body>
 

  <canvas id="scene-canvas"></canvas>

  <!-- overlay biographie -->
  <div id="bioOverlay" class="bio-overlay" aria-hidden="true">
    <div class="bio-sheet" role="dialog" aria-modal="true">
      <button id="bioClose" class="bio-close" aria-label="Fermer">✕</button>

      <div class="bio-left">
        <div class="bio-image-wrap">
          <img id="bioImage" src="" alt="Œuvre">
        </div>
      </div>

      <div class="bio-right">
        <h2 id="bioTitle">Titre de l'œuvre</h2>
        <div id="bioText" class="bio-text">Description complète — texte long prévu pour la biographie. Remplace ce texte par ce que tu veux.</div>

        <div class="bio-actions">
          <button id="bioPrev" class="btn">Précédent</button>
          <button id="bioNext" class="btn">Suivant</button>
        </div>
      </div>
    </div>
  </div>

  <div class="hint-mini">Clique sur le 3eme tableau au centre pour ouvrir la biographie — Échap pour fermer</div>
  <div class="credits">UNSC <img src="https://cdn.helloasso.com/img/logos/croppedimage-2b0858ea35264299ad7d65fc4830286e.png" alt=""></div>
