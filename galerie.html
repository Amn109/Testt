<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Musée Louis Lareng — Entrée</title>
  <link rel="stylesheet" href="galerie.css">
</head>
<body>
  <main id="main" class="stage" role="main" aria-label="Entrée du musée">
    <div id="scene" class="scene">
      <div class="hall">
        <div class="back-wall" aria-hidden="true">
          <div class="bokeh">
            <div class="spot s1" aria-hidden="true"></div>
            <div class="spot s2" aria-hidden="true"></div>
          </div>
          <div class="noise" aria-hidden="true"></div>

          <div class="alcove">
            <div class="alcove-inner">
              <div id="mainFrame" class="frame" role="button" tabindex="0"
                   aria-label="Ouvrir l'image en grand — Louis Lareng" aria-pressed="false">
                <div class="frame-border" aria-hidden="true">
                  <span class="rosette rosette-tl" aria-hidden="true"></span>
                  <span class="rosette rosette-tr" aria-hidden="true"></span>
                  <span class="rosette rosette-bl" aria-hidden="true"></span>
                  <span class="rosette rosette-br" aria-hidden="true"></span>
                </div>

                <div class="inner-rim" aria-hidden="true"></div>

                <div class="canvas">
                  <!-- image initiale (sera remplacée par script.js) -->
                  <img src="img1.jpg"
                       data-highres="img1.jpg"
                       alt="Portrait Louis Lareng"
                       id="portraitImage" draggable="false">
                </div>
              </div>

              <!-- Cartel (plaque musée) -->
              <div class="cartel" role="note" aria-label="Cartel du tableau">
                <div class="cartel-title">Louis Lareng</div>
                <div class="cartel-meta">Portrait — vers 1907 • Don musée</div>
              </div>

              <!-- Gallery controls -->
              <div class="gallery-controls" aria-hidden="false" aria-label="Navigation de la galerie">
                <button class="gbtn gprev" id="btnPrev" aria-label="Image précédente" disabled>
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <div class="gcounter" id="gCounter" aria-live="polite">1 / 9</div>
                <button class="gbtn gnext" id="btnNext" aria-label="Image suivante">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                </button>
              </div>

            </div>
          </div>

          <div id="artLights" class="art-lights" aria-hidden="true">
            <div class="art-light" aria-hidden="true">
              <div class="beam"></div>
              <div class="lamp" aria-hidden="true"></div>
            </div>
            <div class="art-light" aria-hidden="true">
              <div class="beam"></div>
              <div class="lamp" aria-hidden="true"></div>
            </div>
            <div class="art-light" aria-hidden="true">
              <div class="beam"></div>
              <div class="lamp" aria-hidden="true"></div>
            </div>
          </div>

        </div>

        <div class="floor" aria-hidden="true">
          <span class="wood-knots" aria-hidden="true"></span>
        </div>

        <div id="spotlight" class="spotlight" aria-hidden="true"></div>
      </div>
    </div>

    <div id="overlay" class="overlay" aria-hidden="true">
      <h1 class="overlay-title">Galerie</h1>
      <p class="overlay-sub">Louis Lareng</p>
      <div class="progressbar" aria-hidden="true">
        <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </main>

  <!-- LIGHTBOX -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Agrandissement de l'image">
    <div class="lightbox-inner" role="document">
      <button class="lightbox-close" id="lightboxClose" aria-label="Fermer la vue agrandie">Fermer</button>
      <img id="lightboxImage" class="lightbox-img" src="" alt="">
      <div class="lightbox-hint">Esc pour fermer. ← / → pour naviguer.</div>
    </div>
  </div>

  <script src="galerie.js" defer></script>
</body>
</html>
